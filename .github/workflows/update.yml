name: update-radar
on:
  schedule: [{cron: "17 */3 * * *"}]
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python update_radar.py
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit data
        run: |
          git config user.name "radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json history/
          git diff --staged --quiet || (git commit -m "chore: refresh radar data" && git push)
      - run: mkdir site && cp index.html data.json site/
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deploy
        uses: actions/deploy-pages@v4
